<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password | by @rahulsenapatiz</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains+Mono', monospace; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Simple Icon Component since we are using Lucide via CDN
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const ToggleButton = ({ label, active, onClick }) => (
            <button onClick={onClick} className={`flex items-center justify-between p-4 rounded-2xl border-2 transition-all ${active ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-100 bg-white text-slate-400'}`}>
                <span className="text-xs font-black uppercase tracking-tight">{label}</span>
                <div className={`w-10 h-6 rounded-full relative transition-all duration-300 ${active ? 'bg-indigo-600' : 'bg-slate-200'}`}>
                    <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all duration-300 shadow-md ${active ? 'left-5' : 'left-1'}`} />
                </div>
            </button>
        );

        const App = () => {
            const [password, setPassword] = useState('');
            const [length, setLength] = useState(16);
            const [includeUppercase, setIncludeUppercase] = useState(true);
            const [includeLowercase, setIncludeLowercase] = useState(true);
            const [includeNumbers, setIncludeNumbers] = useState(true);
            const [includeSymbols, setIncludeSymbols] = useState(true);
            
            const [activeTab, setActiveTab] = useState('settings');
            const [email, setEmail] = useState('');
            const [note, setNote] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [isSent, setIsSent] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');
            const [copied, setCopied] = useState(false);

            const EMAILJS_SERVICE_ID = "service_jcunjrw";
            const EMAILJS_TEMPLATE_ID = "template_91sap2v";
            const EMAILJS_PUBLIC_KEY = "3f-9E-t_ZAd3BEuTF";

            const generatePassword = useCallback(() => {
                let charset = "";
                if (includeLowercase) charset += "abcdefghijklmnopqrstuvwxyz";
                if (includeUppercase) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                if (includeNumbers) charset += "0123456789";
                if (includeSymbols) charset += "!@#$%^&*()_+~`|}{[]:;?><,./-=";

                if (charset === "") {
                    setPassword("Select an option below");
                    return;
                }

                let generatedPassword = "";
                for (let i = 0; i < length; i++) {
                    generatedPassword += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                setPassword(generatedPassword);
                setIsSent(false);
                setErrorMessage('');
            }, [length, includeUppercase, includeLowercase, includeNumbers, includeSymbols]);

            useEffect(() => {
                generatePassword();
            }, [generatePassword]);

            const calculateStrength = () => {
                let score = 0;
                if (length > 8) score++;
                if (length > 12) score++;
                if (includeUppercase) score++;
                if (includeNumbers) score++;
                if (includeSymbols) score++;
                
                if (score <= 2) return { label: 'Weak', color: 'bg-red-500', text: 'text-red-600' };
                if (score <= 4) return { label: 'Good', color: 'bg-yellow-500', text: 'text-yellow-600' };
                return { label: 'Strong', color: 'bg-green-500', text: 'text-green-600' };
            };

            const strength = calculateStrength();

            const handleCopy = () => {
                const textArea = document.createElement("textarea");
                textArea.value = password;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(textArea);
            };

            const handleSendEmail = async (e) => {
                e.preventDefault();
                const recipientEmail = email.trim();
                if (!recipientEmail || !recipientEmail.includes('@')) {
                    setErrorMessage("Please enter a valid recipient address.");
                    return;
                }

                setIsSending(true);
                setErrorMessage('');

                const payload = {
                    service_id: EMAILJS_SERVICE_ID,
                    template_id: EMAILJS_TEMPLATE_ID,
                    user_id: EMAILJS_PUBLIC_KEY,
                    template_params: {
                        to_email: recipientEmail, 
                        message_note: note || "No additional notes.",
                        generated_password: password,
                        from_name: "Secure Password Generator"
                    }
                };

                try {
                    const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('Failed to send');

                    setIsSent(true);
                    setNote('');
                    setEmail('');
                    setTimeout(() => setIsSent(false), 5000);
                } catch (error) {
                    setErrorMessage(`Transfer failed: ${error.message}`);
                } finally {
                    setIsSending(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 font-sans text-slate-900">
                    <div className="max-w-md mx-auto">
                        <div className="text-center mb-10">
                            <div className="inline-flex items-center justify-center p-4 bg-white rounded-3xl shadow-xl mb-6 text-indigo-600 border border-slate-100">
                                <Icon name="lock" className="w-10 h-10" />
                            </div>
                            <h1 className="text-4xl font-black tracking-tight leading-tight">
                                <span className="text-red-600">Secure</span> <span className="text-blue-600">Password</span>
                            </h1>
                            <p className="mt-2 text-slate-500 font-bold tracking-wide text-sm">build by @rahulsenapatiz</p>
                        </div>

                        <div className="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200 border border-slate-100 p-8 mb-8">
                            <div className="relative group">
                                <div className="w-full bg-slate-50 rounded-2xl border-2 border-slate-100 p-6 pr-14 min-h-[84px] flex items-center break-all font-mono text-2xl text-indigo-700">
                                    {password}
                                </div>
                                <div className="absolute right-2 top-1/2 -translate-y-1/2 flex flex-col gap-1">
                                    <button onClick={generatePassword} className="p-2 text-slate-400 hover:text-indigo-600 rounded-xl transition-all">
                                        <Icon name="refresh-ccw" className="w-5 h-5" />
                                    </button>
                                    <button onClick={handleCopy} className="p-2 text-slate-400 hover:text-indigo-600 rounded-xl transition-all">
                                        {copied ? <Icon name="check-circle-2" className="w-5 h-5 text-green-500" /> : <Icon name="copy" className="w-5 h-5" />}
                                    </button>
                                </div>
                            </div>

                            <div className="mt-6 flex items-center justify-between px-1">
                                <div className="flex items-center gap-2">
                                    <span className={`text-xs font-black uppercase tracking-widest ${strength.text}`}>
                                        {strength.label}
                                    </span>
                                </div>
                                <div className="flex gap-1.5">
                                    {[1, 2, 3, 4, 5].map((step) => {
                                        const isActive = (strength.label === 'Weak' && step <= 1) || 
                                                       (strength.label === 'Good' && step <= 3) || 
                                                       (strength.label === 'Strong' && step <= 5);
                                        return <div key={step} className={`h-2 w-8 rounded-full transition-all duration-700 ${isActive ? strength.color : 'bg-slate-100'}`} />;
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="flex p-1.5 bg-slate-200/50 rounded-2xl mb-8 border border-white/50">
                            <button onClick={() => setActiveTab('settings')} className={`flex-1 flex items-center justify-center gap-2 py-3.5 rounded-[1.1rem] font-black text-sm transition-all ${activeTab === 'settings' ? 'bg-white text-indigo-600 shadow-lg' : 'text-slate-500'}`}>
                                <Icon name="settings" className="w-4 h-4" /> Settings
                            </button>
                            <button onClick={() => setActiveTab('email')} className={`flex-1 flex items-center justify-center gap-2 py-3.5 rounded-[1.1rem] font-black text-sm transition-all ${activeTab === 'email' ? 'bg-white text-indigo-600 shadow-lg' : 'text-slate-500'}`}>
                                <Icon name="mail" className="w-4 h-4" /> Email
                            </button>
                        </div>

                        {activeTab === 'settings' ? (
                            <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 p-8">
                                <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 border-b border-slate-50 pb-2">Configuration</h2>
                                <div className="space-y-8">
                                    <div>
                                        <div className="flex justify-between mb-4">
                                            <label className="text-sm font-bold text-slate-700">Length</label>
                                            <span className="text-sm font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">{length}</span>
                                        </div>
                                        <input type="range" min="6" max="50" value={length} onChange={(e) => setLength(parseInt(e.target.value))} className="w-full h-2.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <ToggleButton label="Uppercase" active={includeUppercase} onClick={() => setIncludeUppercase(!includeUppercase)} />
                                        <ToggleButton label="Lowercase" active={includeLowercase} onClick={() => setIncludeLowercase(!includeLowercase)} />
                                        <ToggleButton label="Numbers" active={includeNumbers} onClick={() => setIncludeNumbers(!includeNumbers)} />
                                        <ToggleButton label="Symbols" active={includeSymbols} onClick={() => setIncludeSymbols(!includeSymbols)} />
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 p-8">
                                <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 border-b border-slate-50 pb-2 text-center text-blue-600">Secure Dispatch</h2>
                                <form onSubmit={handleSendEmail} className="space-y-6">
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Recipient Address</label>
                                        <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="user@example.com" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white focus:outline-none transition-all font-medium" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Private Note</label>
                                        <textarea rows="2" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Add context..." className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white focus:outline-none transition-all resize-none font-medium" />
                                    </div>
                                    <button type="submit" disabled={isSending || isSent} className={`w-full py-5 rounded-[1.5rem] font-black text-lg flex items-center justify-center gap-3 shadow-xl transition-all ${isSent ? 'bg-green-500 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>
                                        {isSending ? <div className="w-6 h-6 border-3 border-white/30 border-t-white rounded-full animate-spin" /> : isSent ? <Icon name="check-circle-2" className="w-6 h-6" /> : <Icon name="send" className="w-6 h-6" />}
                                        {isSending ? 'Sending...' : isSent ? 'Success!' : 'Send Password'}
                                    </button>
                                    {errorMessage && <p className="text-[11px] text-red-600 font-bold text-center mt-2">{errorMessage}</p>}
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
